<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <title>Registro - Peque Mundo</title>
</head>

<body>

  <main class="login-section">

    <div class="brand">
      <img 
        src="{{ url_for('static', filename='img/Logo_pequemundo.png') }}" 
        alt="Peque Mundo" 
        class="logo" 
      />
    </div>

    <div class="login-card">
      <h1>Crear cuenta</h1>
      <p>Regístrate para continuar</p>

      <form class="login-form" id="formRegistro" action="/registro" method="POST" novalidate>

        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Ingresa tu nombre" 
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@ejemplo.com"
            required
          />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input 
            type="tel" 
            id="telefono" 
            name="telefono" 
            placeholder="+56 9 1234 5678" 
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              required
            />
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Mostrar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmar_password">Confirmar contraseña</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirmar_password"
              name="confirmar_password"
              placeholder="Repite tu contraseña"
              required
            />
            <button type="button" class="password-toggle" onclick="togglePassword('confirmar_password', this)" aria-label="Mostrar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" id="confirmarError"></span>
        </div>

        <button type="submit" class="primary-button">
          Confirmar
        </button>

      </form>

      <p class="register-text">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
      </p>
    </div>

  </main>

  <script src="{{ url_for('static', filename='js/registro.js') }}"></script>
</body>
</html>
