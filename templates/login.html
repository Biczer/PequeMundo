<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <title>Login - Peque Mundo</title>
</head>

<body>

  <main class="login-section">

    <div class="brand">
      <img 
        src="{{ url_for('static', filename='img/Logo_pequemundo.png') }}" 
        alt="Peque Mundo" 
        class="logo" 
      />
    </div>

    <div class="login-card">
      <h1>¡Bienvenido!</h1>
      <p>Inicia sesión para continuar</p>

      {% if error %}
        <p class="login-error">{{ error }}</p>
      {% endif %}

      <form class="login-form" action="/login" method="POST">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="ejemplo@ejemplo.com" 
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              required
            />
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Mostrar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="primary-button">
          Iniciar sesión
        </button>
      </form>

      <p class="register-text">
        ¿No tienes cuenta? <a href="/registro">Regístrate</a>
      </p>

      <div class="demo-credentials">
        <p class="demo-credentials__title">Usuarios de prueba</p>
        <table class="demo-credentials__table">
          <thead>
            <tr><th>Rol</th><th>Correo</th><th>Contraseña</th></tr>
          </thead>
          <tbody>
            <tr><td>Admin</td><td>admin@pequemundo.cl</td><td>admin123</td></tr>
            <tr><td>Cliente</td><td>cliente@test.cl</td><td>cliente123</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
