<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../static/css/normalize.css" />
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Login - Peque Mundo</title>
</head>

<body>

  <main class="login-section">

    <div class="brand">
      <img src="/static/img/Logo_pequemundo.png" alt="Peque Mundo" class="logo" />
    </div>

    <div class="login-card">
      <h1>¡Bienvenido!</h1>
      <p>Inicia sesión para continuar</p>

      <form class="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@ejemplo.com" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" />
        </div>

        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>

        <!-- Simulación de navegación -->
        <a href="../index.html" class="primary-button" style="text-align:center; line-height:52px; display:block;">
          Iniciar sesión
        </a>
      </form>

      <p class="register-text">
        ¿No tienes cuenta? <a href="/templates/registro.html">Regístrate</a>
      </p>
    </div>

  </main>

</body>
</html>
