{# carrito_flotante.html #}


<style>

#carrito-fab{
 position:fixed;
 bottom:2.4rem;
 right:2.4rem;
 z-index:9000;
 width:60px;
 height:60px;
 border-radius:50%;
 background:#111827;
 color:white;
 border:none;
 cursor:pointer;
 font-size:1.5rem;
}


#carrito-count{

 position:absolute;
 top:-4px;
 right:-4px;
 background:#4f7df3;
 color:white;
 width:20px;
 height:20px;
 border-radius:50%;
 font-size:12px;
 display:none;
 align-items:center;
 justify-content:center;

}


#carrito-count.visible{
display:flex;
}



#carrito-overlay{

position:fixed;
inset:0;
background:rgba(0,0,0,.4);
z-index:9001;
display:none;

}


#carrito-overlay.open{

display:block;

}



#carrito-drawer{

position:fixed;
top:0;
right:-420px;
width:420px;
max-width:100%;
height:100vh;
background:white;
z-index:9002;
transition:.3s;
display:flex;
flex-direction:column;

}



#carrito-drawer.open{

right:0;

}



.cdr-header{

padding:20px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #ddd;

}



.cdr-items{

flex:1;
overflow:auto;
padding:20px;

}



.cdr-item{

display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee;

}



.cdr-footer{

padding:20px;
border-top:1px solid #ddd;

}



.cdr-checkout-btn{

width:100%;
padding:15px;
background:#111827;
color:white;
border:none;
border-radius:10px;
cursor:pointer;

}



#cdr-toast{

position:fixed;
bottom:80px;
right:30px;
background:#111827;
color:white;
padding:12px 20px;
border-radius:10px;
display:none;
z-index:9999;

}



#cdr-toast.show{

display:block;

}


</style>





<button id="carrito-fab" onclick="carritoAbrir()">

🛒

<span id="carrito-count"></span>

</button>





<div id="carrito-overlay" onclick="carritoCerrar()"></div>





<div id="carrito-drawer">


<div class="cdr-header">

<b>🛒 Mi carrito</b>

<button onclick="carritoCerrar()">X</button>

</div>




<div id="cdr-items" class="cdr-items"></div>





<div class="cdr-footer">


<div>

Total:

<b id="cdr-total">$0</b>

</div>




{% if session.get('usuario_id') %}


<button 
class="cdr-checkout-btn"
onclick="carritoCheckout()">

🔒 Pagar con Mercado Pago

</button>



{% else %}


<button 
class="cdr-checkout-btn"
onclick="location.href='/login'">

👤 Iniciar sesión

</button>



{% endif %}



</div>


</div>






<div id="cdr-toast">

<span id="cdr-toast-text">

Producto agregado

</span>

</div>






<script>


let carrito = JSON.parse(

localStorage.getItem('pm_carrito') || '[]'

);





function carritoGuardar(){

localStorage.setItem(

'pm_carrito',

JSON.stringify(carrito)

);

}






function agregarAlCarrito(
id_producto,
nombre,
precio,
stock
){



let existe = carrito.find(

p => p.id_producto == id_producto

);





if(existe){


if(existe.cantidad < stock){

existe.cantidad++;

}


}else{


carrito.push({

id_producto:id_producto,

nombre:nombre,

precio:Number(precio),

cantidad:1,

stock:Number(stock)

});


}




carritoGuardar();

carritoRender();


carritoToast(
"✅ "+nombre+" agregado"
);



}









function carritoRender(){



let lista=document.getElementById(
'cdr-items'
);


let count=document.getElementById(
'carrito-count'
);


let total=document.getElementById(
'cdr-total'
);




let cantidad = carrito.reduce(

(a,b)=>a+b.cantidad,

0

);





let suma = carrito.reduce(

(a,b)=>a+(b.precio*b.cantidad),

0

);





count.textContent=cantidad;


count.classList.toggle(

'visible',

cantidad>0

);





total.textContent =

"$"+suma.toLocaleString('es-CL');







if(carrito.length===0){


lista.innerHTML="🛒 Carrito vacío";

return;


}







lista.innerHTML = carrito.map(item=>`


<div class="cdr-item">


<div>

<b>${item.nombre}</b>

<br>

$${item.precio.toLocaleString('es-CL')}

</div>



<div>


<button onclick="cantidadProducto(${item.id_producto},-1)">
-
</button>


${item.cantidad}



<button onclick="cantidadProducto(${item.id_producto},1)">
+
</button>



<button onclick="eliminarProducto(${item.id_producto})">

❌

</button>


</div>



</div>


`).join('');




}









function cantidadProducto(id,cambio){



let item = carrito.find(

p=>p.id_producto == id

);



if(!item)return;





item.cantidad += cambio;





if(item.cantidad<=0){


carrito = carrito.filter(

p=>p.id_producto != id

);


}





carritoGuardar();

carritoRender();



}








function eliminarProducto(id){


carrito = carrito.filter(

p=>p.id_producto != id

);



carritoGuardar();

carritoRender();



}








function carritoAbrir(){


document.getElementById(

'carrito-overlay'

).classList.add('open');



document.getElementById(

'carrito-drawer'

).classList.add('open');


}







function carritoCerrar(){



document.getElementById(

'carrito-overlay'

).classList.remove('open');



document.getElementById(

'carrito-drawer'

).classList.remove('open');


}









function carritoToast(msg){


let toast=document.getElementById(

'cdr-toast'

);


document.getElementById(

'cdr-toast-text'

).textContent=msg;



toast.classList.add('show');



setTimeout(()=>{


toast.classList.remove('show');


},2000);



}









async function carritoCheckout(){



if(carrito.length===0){


carritoToast(
"⚠️ Carrito vacío"
);


return;


}






try{



let res = await fetch(

'/carrito/checkout',

{


method:'POST',


headers:{

'Content-Type':'application/json'

},



body:JSON.stringify({


items: carrito.map(item=>({


id_producto:item.id_producto,

nombre:item.nombre,

precio:item.precio,

cantidad:item.cantidad


}))


})



}



);





let data = await res.json();





console.log(data);






if(data.checkout_url){



localStorage.removeItem(

'pm_carrito'

);



window.location.href=data.checkout_url;



}else{



carritoToast(

"❌ "+(data.error || "Error")

);



}





}catch(error){


console.error(error);


carritoToast(

"❌ Error de conexión"

);



}
}


async function carritoCheckout(){

    if(carrito.length === 0){

        carritoToast("⚠️ Carrito vacío");
        return;

    }


    const res = await fetch('/carrito/checkout', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body: JSON.stringify({

            items: carrito.map(item => ({

                id_producto: item.id_producto,
                nombre: item.nombre,
                precio: item.precio,
                cantidad: item.cantidad

            }))

        })

    });


    const data = await res.json();


    console.log("RESPUESTA CHECKOUT:", data);


    if(data.checkout_url){

        localStorage.removeItem('pm_carrito');

        window.location.href = data.checkout_url;

    }else{

        carritoToast(
        data.error || "Error"
        );

    }


}




carritoRender();



</script>
